services:
  sso-checker:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - sso-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/data/sso.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sso-data:
